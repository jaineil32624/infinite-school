<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite School</title>
<meta name="description" content="A pixel-art mystery RPG about a school day that will not end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root { color-scheme: dark; --bg: #05040a; --ink: #f1e9d2; --btn: rgba(241,233,210,0.12); --btn-on: rgba(232,184,74,0.45); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #touch { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; }
  #touch .pad, #touch .btns { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events: auto; }
  #touch .pad { left: calc(18px + env(safe-area-inset-left, 0px)); width: 132px; height: 132px; }
  #touch .btns { right: calc(18px + env(safe-area-inset-right, 0px)); width: 150px; height: 132px; }
  #touch button { position: absolute; border: 1px solid rgba(241,233,210,0.35); background: var(--btn); color: var(--ink);
    font: 18px VT323, monospace; border-radius: 10px; touch-action: none; }
  #touch button.on { background: var(--btn-on); }
  #touch .u { left: 44px; top: 0; width: 44px; height: 44px; } #touch .d { left: 44px; top: 88px; width: 44px; height: 44px; }
  #touch .l { left: 0; top: 44px; width: 44px; height: 44px; } #touch .r { left: 88px; top: 44px; width: 44px; height: 44px; }
  #touch .a { right: 0; top: 40px; width: 58px; height: 58px; border-radius: 50%; } #touch .b { right: 70px; top: 74px; width: 50px; height: 50px; border-radius: 50%; }
  #touch .n { right: 70px; top: 0; width: 50px; height: 30px; font-size: 14px; } #touch .m { right: 4px; top: 0; width: 50px; height: 30px; font-size: 14px; }
  #touch .run { left: 140px; top: 88px; width: 52px; height: 44px; font-size: 14px; }
  noscript { color: var(--ink); font: 20px VT323, monospace; position: fixed; inset: 40% 0 auto; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Infinite School game screen"></canvas>
<div id="touch" hidden>
  <div class="pad">
    <button class="u" data-act="up" aria-label="Up">▲</button><button class="d" data-act="down" aria-label="Down">▼</button>
    <button class="l" data-act="left" aria-label="Left">◀</button><button class="r" data-act="right" aria-label="Right">▶</button>
    <button class="run" data-act="run" aria-label="Run">RUN</button>
  </div>
  <div class="btns">
    <button class="n" data-act="note" aria-label="Notebook">NOTE</button><button class="m" data-act="menu" aria-label="Menu">MENU</button>
    <button class="b" data-act="back" aria-label="Back">B</button><button class="a" data-act="ok" aria-label="OK">A</button>
  </div>
</div>
<noscript>Infinite School needs JavaScript to run.</noscript>
<!-- engine -->
<script>/* src/core.js */
// Infinite School — core namespace, constants and small utilities.
// Every module attaches itself to the global IS object so the game runs
// from file:// with plain <script> tags (no bundler required).
window.IS = window.IS || {};
(function (IS) {
  IS.VERSION = '0.1.0-ch1';
  IS.W = 320; IS.H = 180; IS.T = 16;
  IS.DAY_START = 465;   // 7:45 AM
  IS.DAY_END = 1440;    // midnight

  IS.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  IS.lerp = (a, b, t) => a + (b - a) * t;

  IS.hash = function (str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  // xorshift PRNG — deterministic per seed so loops vary but are reproducible
  IS.rng = function (seed) {
    let s = (seed >>> 0) || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  };
  IS.loopRand = (key) => IS.rng(IS.hash(key) + (IS.S ? IS.S.loop : 1) * 7919)();

  IS.fmtTime = function (m) {
    m = Math.floor(m);
    const h = Math.floor(m / 60) % 24, mm = m % 60;
    let hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + String(mm).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM');
  };

  IS.store = {
    get(k, d) { try { const v = localStorage.getItem('infschool.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('infschool.' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem('infschool.' + k); } catch (e) {} }
  };

  // Content registry. data/*.js files fill these in.
  IS.data = {
    rooms: {}, npcs: {}, speakers: {}, dialogue: {}, scenes: {}, clues: {}, deductions: [],
    items: {}, achievements: [], endings: {}, music: {}, phases: {}, objectives: [],
    loopRules: [], books: [], periods: [], bells: []
  };

  // Scene stack
  IS.stack = [];
  IS.push = (s) => { IS.stack.push(s); s.enter && s.enter(); };
  IS.pop = () => { const s = IS.stack.pop(); s && s.exit && s.exit(); return s; };
  IS.top = () => IS.stack[IS.stack.length - 1];
  IS.replaceAll = (s) => { while (IS.stack.length) IS.pop(); IS.push(s); };
})(window.IS);

</script>
<script>/* src/input.js */
// Unified input: keyboard, gamepad (standard mapping) and touch buttons.
// Game code only ever asks about abstract actions: up/down/left/right/ok/back/menu/note/run.
(function (IS) {
  const KEYS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right', KeyZ: 'ok', Enter: 'ok', Space: 'ok', KeyE: 'ok',
    KeyX: 'back', Backspace: 'back', Escape: 'menu', KeyP: 'menu', KeyN: 'note', KeyC: 'note', Tab: 'note',
    ShiftLeft: 'run', ShiftRight: 'run'
  };
  const PAD = { 0: 'ok', 1: 'back', 2: 'run', 3: 'note', 9: 'menu', 8: 'note', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };
  const ACTIONS = ['up', 'down', 'left', 'right', 'ok', 'back', 'menu', 'note', 'run'];

  const I = { held: {}, pressed: {}, typed: [], mode: 'keys', repT: {} };
  const kb = {}, pad = {}, touch = {}, latch = {};
  I.textMode = false;
  let prev = {};

  addEventListener('keydown', (e) => {
    let a = KEYS[e.code];
    if (e.key && e.key.length === 1) I.typed.push(e.key);
    if (e.code === 'Backspace') I.typed.push('\b');
    // while typing a name, letters are letters, not actions
    if (I.textMode && (e.code === 'Backspace' || (e.key && e.key.length === 1 && e.code !== 'Space'))) a = null;
    if (a) { if (!e.repeat) latch[a] = true; kb[a] = true; e.preventDefault(); }
    I.mode = 'keys';
    IS.A && IS.A.unlock();
  });
  addEventListener('keyup', (e) => { const a = KEYS[e.code]; if (a) kb[a] = false; });
  addEventListener('blur', () => { for (const k in kb) kb[k] = false; });
  addEventListener('pointerdown', () => { IS.A && IS.A.unlock(); }, { passive: true });

  I.bindTouch = function (root) {
    root.querySelectorAll('[data-act]').forEach((el) => {
      const a = el.dataset.act;
      const on = (e) => { e.preventDefault(); touch[a] = true; el.classList.add('on'); I.mode = 'touch'; IS.A && IS.A.unlock(); };
      const off = (e) => { e.preventDefault(); touch[a] = false; el.classList.remove('on'); };
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
    });
  };

  function pollPad() {
    for (const k in pad) pad[k] = false;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const g of pads) {
      if (!g) continue;
      g.buttons.forEach((b, i) => { if (b.pressed && PAD[i]) { pad[PAD[i]] = true; I.mode = 'pad'; } });
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      if (ax < -0.5) pad.left = true; if (ax > 0.5) pad.right = true;
      if (ay < -0.5) pad.up = true; if (ay > 0.5) pad.down = true;
      if (g.buttons[7] && g.buttons[7].value > 0.5) pad.run = true; // RT also runs
    }
  }

  I.update = function (dt) {
    pollPad();
    for (const a of ACTIONS) {
      const h = !!(kb[a] || pad[a] || touch[a]);
      if (latch[a] && !prev[a]) { I.pressed[a] = true; I.held[a] = true; prev[a] = true; latch[a] = false; I.repT[a] = h ? (I.repT[a] || 0) + dt : 0; continue; }
      latch[a] = false;
      I.pressed[a] = h && !prev[a];
      I.held[a] = h;
      prev[a] = h;
      // menu-style auto repeat
      if (h) I.repT[a] = (I.repT[a] || 0) + dt; else I.repT[a] = 0;
    }
  };
  // true on first press, then repeatedly while held (for menus)
  I.rep = function (a) {
    if (I.pressed[a]) return true;
    const t = I.repT[a] || 0;
    if (t > 0.38) { I.repT[a] -= 0.09; return true; }
    return false;
  };
  I.back = () => I.pressed.back || I.pressed.menu;
  I.clear = () => { for (const a of ACTIONS) { I.pressed[a] = false; } I.typed.length = 0; };

  IS.I = I;
})(window.IS);

</script>
<script>/* src/audio.js */
// Procedural chiptune engine (Web Audio). No audio files: every theme is a
// pattern in data/music.js, and every sound effect is synthesized here.
(function (IS) {
  const A = { ctx: null, cur: null, want: null, step: 0, nextT: 0, timer: null, detune: 0 };
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

  function parse(str) {
    // tokens: C5, F#4, Bb3, '.' = rest, '-' = hold previous
    const toks = str.trim().split(/\s+/);
    const out = [];
    toks.forEach((t, i) => {
      if (t === '.' || t === '-') { out.push(null); return; }
      const m = /^([A-G])(#|b)?(-?\d)$/.exec(t);
      if (!m) { out.push(null); return; }
      let n = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
      let len = 1; for (let j = i + 1; j < toks.length && toks[j] === '-'; j++) len++;
      out.push({ n, len });
    });
    return out;
  }

  A.unlock = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      A.ctx = new C();
      A.master = A.ctx.createGain(); A.master.connect(A.ctx.destination);
      A.mus = A.ctx.createGain(); A.mus.connect(A.master);
      A.fx = A.ctx.createGain(); A.fx.connect(A.master);
      // gentle echo on music for atmosphere
      const d = A.ctx.createDelay(); d.delayTime.value = 0.28;
      const fb = A.ctx.createGain(); fb.gain.value = 0.22;
      A.mus.connect(d); d.connect(fb); fb.connect(d); d.connect(A.master);
      A.apply();
      A.timer = setInterval(A.tick, 25);
      if (A.want) { const w = A.want; A.want = null; A.play(w); }
    } catch (e) { A.ctx = null; }
  };

  A.apply = function () {
    if (!A.ctx) return;
    const s = IS.settings || { master: 0.8, music: 0.6, sfx: 0.8 };
    A.master.gain.value = s.master;
    A.mus.gain.value = s.music * 0.32;
    A.fx.gain.value = s.sfx * 0.45;
  };

  function tone(dest, freq, t, dur, type, vol, slide) {
    const o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (A.detune) o.detune.setValueAtTime((Math.random() - 0.5) * A.detune, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol) {
    const len = Math.floor(A.ctx.sampleRate * dur);
    const buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    const ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = A.ctx.createBufferSource(), g = A.ctx.createGain();
    s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(A.fx); s.start(t);
  }

  A.play = function (id) {
    if (A.cur && A.cur.id === id) return;
    if (!A.ctx) { A.want = id; return; }
    const m = IS.data.music[id];
    if (!m) { A.cur = null; return; }
    A.cur = { id, m, lead: parse(m.lead), bass: parse(m.bass), pad: m.pad ? parse(m.pad) : null };
    A.step = 0; A.nextT = A.ctx.currentTime + 0.1;
  };
  A.stop = function () { A.cur = null; };

  A.tick = function () {
    if (!A.ctx || !A.cur) return;
    const c = A.cur, spb = 60 / c.m.bpm / 2; // 8th notes
    while (A.nextT < A.ctx.currentTime + 0.12) {
      const i = A.step;
      const L = c.lead[i % c.lead.length], B = c.bass[i % c.bass.length];
      if (L) tone(A.mus, midi(L.n), A.nextT, spb * L.len * 0.95, c.m.wave || 'square', c.m.leadVol || 0.18);
      if (B) tone(A.mus, midi(B.n), A.nextT, spb * B.len * 0.9, c.m.bassWave || 'triangle', c.m.bassVol || 0.3);
      if (c.pad) { const P = c.pad[i % c.pad.length]; if (P) tone(A.mus, midi(P.n), A.nextT, spb * P.len, 'sine', 0.08); }
      A.nextT += spb; A.step++;
    }
  };

  const SFX = {
    blip(t, p) { tone(A.fx, p || 620, t, 0.035, 'square', 0.07); },
    select(t) { tone(A.fx, 660, t, 0.05, 'square', 0.12); },
    confirm(t) { tone(A.fx, 523, t, 0.06, 'square', 0.14); tone(A.fx, 784, t + 0.06, 0.09, 'square', 0.14); },
    back(t) { tone(A.fx, 392, t, 0.07, 'square', 0.12, 0.7); },
    door(t) { noise(t, 0.12, 0.25); tone(A.fx, 110, t, 0.15, 'triangle', 0.3, 0.6); },
    clue(t) { [72, 76, 79, 84].forEach((n, i) => tone(A.fx, midi(n), t + i * 0.07, 0.18, 'triangle', 0.22)); },
    deduce(t) { [60, 67, 72, 76, 79, 84].forEach((n, i) => tone(A.fx, midi(n), t + i * 0.06, 0.3, 'square', 0.13)); },
    wrong(t) { tone(A.fx, 220, t, 0.18, 'sawtooth', 0.1, 0.8); },
    ach(t) { [67, 72, 76, 72, 79].forEach((n, i) => tone(A.fx, midi(n), t + i * 0.08, 0.16, 'square', 0.12)); },
    bell(t) { [0, 0.35].forEach((o) => { tone(A.fx, 988, t + o, 1.6, 'sine', 0.22); tone(A.fx, 1318, t + o, 1.1, 'sine', 0.1); tone(A.fx, 494, t + o, 1.9, 'sine', 0.12); }); },
    glitch(t) { noise(t, 0.25, 0.3); tone(A.fx, 80, t, 0.25, 'sawtooth', 0.15, 3); },
    loop(t) { [84, 79, 76, 72, 67, 60, 55, 48].forEach((n, i) => tone(A.fx, midi(n), t + i * 0.11, 0.5, 'sine', 0.2)); },
    step(t) { tone(A.fx, 90, t, 0.03, 'triangle', 0.05); }
  };
  A.sfx = function (id, p) { if (!A.ctx || !SFX[id]) return; SFX[id](A.ctx.currentTime + 0.005, p); };

  IS.A = A;
})(window.IS);

</script>
<script>/* src/art.js */
// Procedural pixel art: tiles, characters and portraits are drawn from code
// so the game ships without image assets. Swap any function for a sprite
// sheet later without touching game logic.
(function (IS) {
  const Art = { night: false };

  const THEMES = {
    school:  { floor: ['#c4ad86', '#bba37c'], line: '#a8916c', top: '#2c2338', face: '#7b6b92', fline: '#6c5c83', trim: '#a898bf', base: '#251c2f' },
    library: { floor: ['#6e4632', '#66402d'], line: '#55352a', top: '#1e1828', face: '#4f3f62', fline: '#433555', trim: '#7e6a96', base: '#160f1e' },
    cafe:    { floor: ['#d8d0bd', '#a9a08d'], line: '#9a917f', top: '#2c2338', face: '#8d7d7a', fline: '#7c6c69', trim: '#b8a4a0', base: '#2a2024' },
    gym:     { floor: ['#c98f52', '#c08848'], line: '#a8743e', top: '#2c2338', face: '#6e7e92', fline: '#5f6f83', trim: '#9fb0c4', base: '#20242c' },
    lobby:   { floor: ['#cfc8bd', '#c4bdb1'], line: '#b0a99d', top: '#2c2338', face: '#857597', fline: '#766688', trim: '#b2a2c4', base: '#251c2f' },
    office:  { floor: ['#7a2f38', '#702a33'], line: '#5e2229', top: '#241c2c', face: '#6c5a52', fline: '#5c4b44', trim: '#a08a78', base: '#1c1418' },
    outdoor: { floor: ['#5f8a4c', '#5a8448'], line: '#4f7740', top: '#3a3046', face: '#8c7a9a', fline: '#7a688a', trim: '#b4a3c4', base: '#2a2134' },
    roof:    { floor: ['#77737e', '#716d78'], line: '#615e69', top: '#3a3046', face: '#5d5866', fline: '#504c58', trim: '#8a8494', base: '#24212a' },
    anomaly: { floor: ['#47656f', '#415d66'], line: '#36505a', top: '#0b1016', face: '#344c57', fline: '#2b414b', trim: '#86c9d2', base: '#060a0e' },
    sub:     { floor: ['#262b37', '#232833'], line: '#1c212b', top: '#07080c', face: '#1e2430', fline: '#181d27', trim: '#3d6e78', base: '#040507' }
  };
  Art.THEMES = THEMES;
  Art.SOLID = new Set('#EKWLDTBP=XrhoqvFYxwb'.split(''));
  Art.WALLS = new Set('#EKWXr'.split(''));

  const hsh = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

  Art.tile = function (c, ch, x, y, tx, ty, th, below, t) {
    const p = THEMES[th] || THEMES.school;
    const R = (col, a, b, w, h) => { c.fillStyle = col; c.fillRect(x + a, y + b, w, h); };
    const floor = () => {
      const f = p.floor[(tx + ty) & 1];
      if (th === 'cafe') { R(f, 0, 0, 16, 16); return; }
      R(p.floor[0], 0, 0, 16, 16);
      if (th === 'outdoor') { const h = hsh(tx, ty); R(p.line, h % 13, (h >> 4) % 13, 1, 2); R(p.floor[1], (h >> 8) % 12, (h >> 12) % 12, 2, 1); return; }
      if (th === 'roof') { const h = hsh(tx, ty); R(p.line, h % 15, (h >> 3) % 15, 1, 1); R(p.line, (h >> 6) % 15, (h >> 9) % 15, 1, 1); return; }
      if (th === 'office') { R(p.line, 0, 15, 16, 1); return; }
      if (th === 'lobby' || th === 'anomaly' || th === 'sub') { R(p.line, 0, 15, 16, 1); R(p.line, 15, 0, 1, 16); return; }
      R(p.line, 0, (tx & 1) ? 7 : 15, 16, 1); // plank seams
      R(p.floor[1], (hsh(tx, ty) % 12), 3, 3, 1);
    };
    const wall = () => {
      if (Art.WALLS.has(below)) { R(p.top, 0, 0, 16, 16); R(p.base, 0, 15, 16, 1); return false; }
      R(p.face, 0, 0, 16, 16); R(p.trim, 0, 0, 16, 2); R(p.fline, 0, 6, 16, 1); R(p.base, 0, 13, 16, 3); return true;
    };
    switch (ch) {
      case '#': case 'E': wall(); break;
      case 'X': R('#000', 0, 0, 16, 16); break;
      case 'K': if (wall()) { R('#2d5a45', 1, 3, 14, 8); R('#3f7059', 1, 3, 14, 1); R('#dfe6d0', 3 + (tx % 3), 5, 4, 1); R('#dfe6d0', 2 + (tx % 4), 8, 6, 1); } break;
      case 'W': if (wall()) { const g = Art.night ? '#1a2342' : '#93c6d6'; R('#e8e0d0', 2, 2, 12, 10); R(g, 3, 3, 10, 8); R(Art.night ? '#2a3560' : '#cfeaf2', 4, 4, 3, 2); R('#e8e0d0', 7, 3, 1, 8); } break;
      case 'r': R(p.floor[0], 0, 0, 16, 16); R('#4a4552', 0, 2, 16, 2); R('#4a4552', 0, 9, 16, 2); R('#3a3640', (tx % 2) * 8 + 2, 0, 2, 14); break;
      case 'F': floor(); R('#3f3a48', 0, 3, 16, 2); R('#3f3a48', 0, 10, 16, 2); for (let i = 1; i < 16; i += 5) R('#2e2a36', i, 1, 2, 14); break;
      case 'G': floor(); R('#5d5568', 0, 2, 2, 13); R('#5d5568', 14, 2, 2, 13); R('rgba(220,230,240,0.35)', 2, 0, 12, 16); break;
      case 'Y': floor(); R('#5a3d2a', 6, 9, 4, 7); R('#2f5a32', 0, 0, 16, 11); R('#3f7642', 2, 1, 10, 7); R('#58924f', 4, 2, 4, 3); break;
      case 'g': R('#4f7a3e', 0, 0, 16, 16); { const h = hsh(tx, ty); R('#e6c84a', h % 13, (h >> 4) % 13, 2, 2); R('#d96a6a', (h >> 8) % 13, (h >> 12) % 13, 2, 2); R('#3e6532', (h >> 5) % 14, (h >> 9) % 14, 1, 2); } break;

    // accessories on body
    if (L.acc === 'tie') R(L.accC || '#a02c2c', -1, -12 + bob, 2, 5);
    if (L.acc === 'apron') R(L.accC || '#d8d0c0', -3, -10 + bob, 6, 5);

    if (dir === 0) { R('#1b1620', -2, -15 + bob, 1, 2); R('#1b1620', 1, -15 + bob, 1, 2); }
    if (dir === 2) R('#1b1620', -3, -15 + bob, 1, 2);

  };

  Art.PLAYER = { skin: '#e0b48e', hair: '#3b2a24', hs: 'short', top: '#3c4a7a', bot: '#2a2a36', acc: 'tie', accC: '#8a2c3a' };

<script>/* src/state.js */
// Game state, rules engine (conditions/effects), time loop and persistence.
// Flags prefixed "L." are loop-local and are wiped at midnight. Everything
// else (clues, deductions, knowledge) survives the reset: that is the game.
(function (IS) {
  const G = {};
  const DEF_SETTINGS = { master: 0.8, music: 0.6, sfx: 0.8, textSpeed: 1, shake: true, fx: 2, crt: false, big: false, plain: false, contrast: false, touch: 0, flow: 1, hints: true };
  IS.settings = Object.assign({}, DEF_SETTINGS, IS.store.get('settings', {}));
  IS.meta = Object.assign({ ach: {}, endings: {}, bestLoop: 0 }, IS.store.get('meta', {}));

  G.saveSettings = () => { IS.store.set('settings', IS.settings); IS.A.apply(); };
  G.saveMeta = () => IS.store.set('meta', IS.meta);

  G.newGame = function (name) {
    IS.S = {
      v: 1, name: (name || 'Ash').slice(0, 10), loop: 1, time: IS.DAY_START, room: 'c2b', x: 0, y: 0, dir: 1,
      flags: {}, clues: [], newClues: {}, bonds: {}, insight: {}, items: [], phase: 1, visited: {},
      playMs: 0, created: Date.now()
    };
    G.loopRules();
  };

  // ---------- flags / progress ----------
  G.has = (f) => !!(IS.S && IS.S.flags[f]);
  G.set = (f, v) => { IS.S.flags[f] = v === undefined ? true : v; };
  G.unset = (f) => { delete IS.S.flags[f]; };

  G.addClue = function (id) {
    const S = IS.S, c = IS.data.clues[id];
    if (!c) { console.warn('Unknown clue', id); return false; }
    if (S.clues.includes(id)) return false;
    S.clues.push(id); S.newClues[id] = 1;
    IS.UI.toast('New clue: ' + c.title, 'clue'); IS.A.sfx('clue');
    return true;
  };

  G.bond = function (n, v) {
    const S = IS.S;
    const before = S.bonds[n] || 0;
    S.bonds[n] = IS.clamp(before + v, 0, 5);
    S.insight[n] = Math.max(S.insight[n] || 0, S.bonds[n]);
    if (S.bonds[n] > before) {
      const nm = (IS.data.npcs[n] && IS.data.npcs[n].short) || n;
      IS.UI.toast(nm + '  ' + '♥'.repeat(S.bonds[n]) + '·'.repeat(5 - S.bonds[n]), 'bond');
    }
  };

  G.ach = function (id) {
    if (IS.meta.ach[id]) return;
    const a = IS.data.achievements.find((x) => x.id === id);
    if (!a) return;
    IS.meta.ach[id] = Date.now(); G.saveMeta();
    IS.UI.toast('Achievement — ' + a.title, 'ach'); IS.A.sfx('ach');
  };
  G.checkAch = function () {
    if (!IS.S) return;
    for (const a of IS.data.achievements) if (a.auto && !IS.meta.ach[a.id] && G.ok(a.auto)) G.ach(a.id);
  };

  G.setPhase = function (n) {
    if (n <= IS.S.phase) return;
    IS.S.phase = n;
    IS.pendingCard = { big: 'PHASE ' + n, small: IS.data.phases[n] || '', sfx: 'glitch' };
  };

  G.isAware = function (id) {
    const n = IS.data.npcs[id]; if (!n) return false;
    return !!(n.aware || (n.awareIf && G.ok(n.awareIf)));
  };

  // Try to connect two clues on the evidence board
  G.deduce = function (a, b) {
    for (const d of IS.data.deductions) {
      const hit = d.pairs.some((p) => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
      if (!hit) continue;
      if (G.has('d.' + d.id)) return { already: true, d };
      G.set('d.' + d.id);
      IS.A.sfx('deduce');
      G.ach('red_string');
      G.apply(d.do);
      if (IS.data.deductions.every((x) => G.has('d.' + x.id))) G.ach('conspiracy');
      return { ok: true, d };
    }
    return null;
  };

  // ---------- conditions ----------
  G.ok = function (c) {
    if (!c) return true;
    const S = IS.S;
    const arr = (v) => [].concat(v);
    if (c.flag && !arr(c.flag).every(G.has)) return false;
    if (c.not && arr(c.not).some(G.has)) return false;
    if (c.any && !arr(c.any).some(G.has)) return false;
    if (c.loop && (S.loop < c.loop[0] || S.loop > (c.loop[1] == null ? 1e9 : c.loop[1]))) return false;
    if (c.time && (S.time < c.time[0] || S.time >= c.time[1])) return false;
    if (c.phase && S.phase < c.phase) return false;
    if (c.maxPhase && S.phase > c.maxPhase) return false;
    if (c.room && S.room !== c.room) return false;
    if (c.bond) for (const k in c.bond) if ((S.bonds[k] || 0) < c.bond[k]) return false;
    if (c.insight) for (const k in c.insight) if ((S.insight[k] || 0) < c.insight[k]) return false;
    if (c.n) for (const k in c.n) if ((S.flags[k] || 0) < c.n[k]) return false;
    if (c.clue && !arr(c.clue).every((id) => S.clues.includes(id))) return false;
    if (c.noclue && arr(c.noclue).some((id) => S.clues.includes(id))) return false;
    if (c.clues && S.clues.length < c.clues) return false;
    if (c.item && !arr(c.item).every((i) => S.items.includes(i))) return false;
    if (c.noitem && arr(c.noitem).some((i) => S.items.includes(i))) return false;
    if (c.visited && !arr(c.visited).every((r) => S.visited[r])) return false;
    if (c.allRooms && !Object.keys(IS.data.rooms).filter((r) => !IS.data.rooms[r].secret).every((r) => S.visited[r])) return false;
    if (c.chance && IS.loopRand(c.seed || 'chance') > c.chance) return false;
    if (c.or && !c.or.some(G.ok)) return false;
    return true;
  };

  // ---------- effects ----------
  G.apply = function (e) {
    if (!e) return;
    const S = IS.S, arr = (v) => [].concat(v);
    if (e.set) arr(e.set).forEach((f) => G.set(f));
    if (e.unset) arr(e.unset).forEach(G.unset);
    if (e.inc) arr(e.inc).forEach((f) => { S.flags[f] = (S.flags[f] || 0) + 1; });
    if (e.clue) arr(e.clue).forEach(G.addClue);
    if (e.bond) for (const k in e.bond) G.bond(k, e.bond[k]);
    if (e.item) arr(e.item).forEach((i) => { if (!S.items.includes(i)) { S.items.push(i); IS.UI.toast('Got: ' + IS.data.items[i].name, 'item'); IS.A.sfx('confirm'); } });
    if (e.take) arr(e.take).forEach((i) => { S.items = S.items.filter((x) => x !== i); });
    if (e.time) S.time = Math.min(IS.DAY_END - 1, S.time + e.time);
    if (e.timeTo) S.time = Math.max(S.time, e.timeTo);
    if (e.nextBell) { const b = IS.data.bells.find((x) => x[0] > S.time); S.time = b ? b[0] : Math.max(S.time, 900); }
    if ((e.time || e.timeTo || e.nextBell) && IS.Wd.room) { IS.Wd.placeNPCs(true); IS.Wd.music(); IS.Wd.fade = 1; }
    if (e.phase) G.setPhase(e.phase);
    if (e.ach) G.ach(e.ach);
    if (e.sfx) IS.A.sfx(e.sfx);
    if (e.shake && IS.settings.shake) IS.Wd.shake = Math.max(IS.Wd.shake, e.shake);
    if (e.glitch) IS.Wd.glitch = Math.max(IS.Wd.glitch, e.glitch);
    if (e.warp) IS.pendingWarp = e.warp;
    if (e.ending) IS.pendingEnding = e.ending;
    if (e.endDay) IS.pendingMidnight = true;
    if (e.card) IS.pendingCard = e.card;
    if (e.toast) IS.UI.toast(e.toast);
    if (e.music) IS.A.play(e.music);
    G.checkAch();
  };

  // ---------- time & loop ----------
  G.period = function (t) {
    let p = IS.data.periods[0];
    for (const x of IS.data.periods) if (t >= x[0]) p = x;
    return p ? p[1] : '';
  };

  G.loopRules = function () { for (const r of IS.data.loopRules) if (G.ok(r.if)) G.apply(r.do); };

  G.resetLoop = function () {
    const S = IS.S;
    S.loop++;
    IS.meta.bestLoop = Math.max(IS.meta.bestLoop || 0, S.loop); G.saveMeta();
    for (const k of Object.keys(S.flags)) if (k.startsWith('L.')) delete S.flags[k];
    for (const n of Object.keys(S.bonds)) if (!G.isAware(n)) S.bonds[n] = 0;
    S.items = S.items.filter((i) => IS.data.items[i] && IS.data.items[i].anchored);
    S.time = IS.DAY_START;
    G.loopRules();
    // endings that trigger on waking up
    for (const id in IS.data.endings) {
      const e = IS.data.endings[id];
      if (e.onLoop && G.ok(e.onLoop)) { IS.pendingEnding = id; return; }
    }
    const r = IS.data.rooms.c2b;
    S.room = 'c2b'; S.x = r.spawn[0]; S.y = r.spawn[1]; S.dir = 1;
    G.checkAch();
    G.save('auto');
  };

  // ---------- persistence ----------
  G.save = function (slot) {
    if (!IS.S) return;
    if (IS.Wd && IS.Wd.p) { IS.S.x = Math.floor(IS.Wd.p.x / 16); IS.S.y = Math.floor((IS.Wd.p.y - 1) / 16); IS.S.dir = IS.Wd.p.dir; }
    const snap = JSON.parse(JSON.stringify(IS.S)); snap.savedAt = Date.now();
    IS.store.set('slot.' + slot, snap);
    if (slot !== 'auto') { IS.UI.toast('Saved to slot ' + slot); IS.A.sfx('confirm'); }
  };
  G.slot = (slot) => IS.store.get('slot.' + slot, null);
  G.load = function (slot) {
    const s = G.slot(slot); if (!s) return false;
    IS.S = s; return true;
  };

  IS.G = G;
})(window.IS);

</script>

// The overworld: room building, movement + collision, NPC schedules,
// interaction, the clock, and the lighting / anomaly post effects.
(function (IS) {
  const T = 16;
  const Wd = { room: null, grid: null, npcs: [], p: { x: 0, y: 0, dir: 0, anim: 0, moving: false }, cam: { x: 0, y: 0 },
    shake: 0, glitch: 0, fade: 0, parts: [], schedKey: '', schedT: 0, t: 0, stepT: 0, title: null, titleT: 0 };

  const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0]]; // down, up, left, right

  Wd.tileAt = (tx, ty) => (!Wd.grid || ty < 0 || tx < 0 || ty >= Wd.grid.length || tx >= Wd.grid[0].length) ? '#' : Wd.grid[ty][tx];
  Wd.solidAt = (tx, ty) => IS.Art.SOLID.has(Wd.tileAt(tx, ty));

  Wd.build = function () {
    const r = Wd.room;
    Wd.grid = r.map.map((row) => row.padEnd(r.w, '#').slice(0, r.w).split(''));
    for (const d of r.dyn || []) if (IS.G.ok(d.if)) Wd.grid[d.y][d.x] = d.t;
  };

  Wd.enter = function (id, tx, ty, dir, opts) {
    opts = opts || {};
    const r = IS.data.rooms[id];
    if (!r) { console.warn('No room', id); return; }
    const S = IS.S;
    r.id = id; Wd.room = r; S.room = id;
    r.w = r.map[0].length; r.h = r.map.length;
    Wd.build();
    Wd.p.x = tx * T + 8; Wd.p.y = ty * T + 13; Wd.p.dir = dir == null ? Wd.p.dir : dir;
    S.visited[id] = 1;
    Wd.fade = 1; Wd.schedKey = ''; Wd.placeNPCs(true);
    Wd.parts = [];
    Wd.music();
    if (!opts.silent) { Wd.title = r.name; Wd.titleT = 2.2; }
    IS.G.checkAch();
    // room enter events
    if (!opts.noEvents) for (const ev of r.enter || []) {
      if (IS.G.ok(ev.if) && !(ev.once && IS.G.has('L.seen.' + ev.scene)) && !(ev.onceEver && IS.G.has('seen.' + ev.scene))) { IS.pendingScene = ev.scene; break; }
    }
  };

  Wd.music = function () {
    const r = Wd.room; if (!r) return;
    let m = r.music;
    if (IS.S.time >= 1260 && r.nightMusic !== false && !r.keepMusic) m = 'night';
    else if (IS.S.time >= 1020 && r.duskMusic) m = r.duskMusic;
    IS.A.play(m);
  };

  // ---------- NPC scheduling ----------
  function schedEntry(n) {
    if (n.absentIf && IS.G.ok(n.absentIf)) return null;
    let e = null;
    for (const s of n.sched || []) if (IS.S.time >= s[0]) e = s;
    if (!e || !e[1]) return null;
    const o = e[5] || {};
    if (o.if && !IS.G.ok(o.if)) return null;
    let room = e[1], x = e[2], y = e[3];
    if (o.vary) { const v = o.vary[Math.floor(IS.loopRand(n.id + e[0]) * o.vary.length)]; room = v[0]; x = v[1]; y = v[2]; }
    return { room, x, y, dir: e[4] || 0, wander: o.wander };
  }

  Wd.placeNPCs = function (force) {
    const list = [];
    for (const id in IS.data.npcs) {
      const n = IS.data.npcs[id]; n.id = id;
      const e = schedEntry(n);
      if (e && e.room === Wd.room.id) list.push({ id, x: e.x, y: e.y, dir: e.dir, wander: e.wander });
    }
    for (const ln of Wd.room.npcs || []) if (IS.G.ok(ln.if)) list.push(Object.assign({}, ln));
    const key = list.map((n) => n.id + n.x + ',' + n.y).join('|');
    if (!force && key === Wd.schedKey) return;
    Wd.schedKey = key;
    Wd.npcs = list.map((n) => {
      const old = Wd.npcs.find((o) => o.id === n.id && o.hx === n.x && o.hy === n.y);
      if (old && !force) return old;
      return { id: n.id, talk: n.talk || n.id, ghost: n.ghost, hx: n.x, hy: n.y, x: n.x * T + 8, y: n.y * T + 13, dir: n.dir, baseDir: n.dir,
        wander: n.wander, wt: Math.random() * 3, vx: 0, vy: 0, anim: 0 };
    });
  };

  // ---------- collision ----------
  function blocked(x, y, self) {
    const hw = 4;
    const pts = [[x - hw, y - 4], [x + hw - 1, y - 4], [x - hw, y], [x + hw - 1, y]];
    for (const [px, py] of pts) if (Wd.solidAt(Math.floor(px / T), Math.floor(py / T))) return true;
    for (const n of Wd.npcs) {
      if (n === self) continue;
      if (Math.abs(n.x - x) < 9 && Math.abs(n.y - y) < 6) return true;
    }
    if (self && self !== Wd.p && Math.abs(Wd.p.x - x) < 9 && Math.abs(Wd.p.y - y) < 6) return true;
    return false;
  }

  function moveEnt(e, dx, dy) {
    if (dx && !blocked(e.x + dx, e.y, e)) e.x += dx;
    else if (dx && e === Wd.p) { // corner slide
      if (!blocked(e.x + dx, e.y - 3, e) && blocked(e.x + dx, e.y + 3, e)) e.y -= 0.6;
      else if (!blocked(e.x + dx, e.y + 3, e) && blocked(e.x + dx, e.y - 3, e)) e.y += 0.6;
    }
    if (dy && !blocked(e.x, e.y + dy, e)) e.y += dy;
    else if (dy && e === Wd.p) {
      if (!blocked(e.x - 3, e.y + dy, e) && blocked(e.x + 3, e.y + dy, e)) e.x -= 0.6;
      else if (!blocked(e.x + 3, e.y + dy, e) && blocked(e.x - 3, e.y + dy, e)) e.x += 0.6;
    }
  }

  // ---------- interaction ----------
  function objAt(tx, ty) {
    for (const o of Wd.room.obj || []) {
      const w = o.w || 1, h = o.h || 1;
      if (tx >= o.x && tx < o.x + w && ty >= o.y && ty < o.y + h) {
        const e = IS.D.pick(o.d); if (e) return e;
      }
    }
    return null;
  }
  function npcNear(px, py) {
    let best = null, bd = 1e9;
    for (const n of Wd.npcs) { const d = Math.hypot(n.x - px, n.y - py); if (d < 13 && d < bd) { bd = d; best = n; } }
    return best;
  }

  Wd.interact = function () {
    const p = Wd.p, [dx, dy] = DIRS[p.dir];
    const n = npcNear(p.x + dx * 10, p.y - 2 + dy * 10);
    if (n) return Wd.talk(n);
    const tx = Math.floor((p.x + dx * 10) / T), ty = Math.floor((p.y - 3 + dy * 10) / T);
    let e = objAt(tx, ty);
    if (e) return IS.D.run(e);
    // reach across counters / tables
    const ch = Wd.tileAt(tx, ty);
    if ('=T'.includes(ch)) {
      const n2 = npcNear(p.x + dx * 26, p.y - 2 + dy * 26);
      if (n2) return Wd.talk(n2);
    }
    // generic lore books on library shelves
    if (ch === 'B' && Wd.room.books && IS.data.books.length) {
      const b = IS.data.books[(tx * 31 + ty * 17 + IS.S.loop) % IS.data.books.length];
      return IS.D.run({ lines: b });
    }
    e = objAt(Math.floor(p.x / T), Math.floor((p.y - 3) / T));
    if (e) return IS.D.run(e);
  };

  Wd.talk = function (n) {
    const p = Wd.p;
    const dx = p.x - n.x, dy = p.y - n.y;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0);
    n.vx = n.vy = 0;
    const e = IS.D.pick(IS.data.dialogue[n.talk]);
    if (e) { IS.D.run(e, n); return true; }
    IS.D.run({ lines: ['They seem busy.'] });
    return true;
  };

  // ---------- update ----------
  Wd.update = function (dt) {
    const I = IS.I, p = Wd.p, S = IS.S;
    Wd.t += dt;
    if (Wd.fade > 0) Wd.fade = Math.max(0, Wd.fade - dt * 3);
    if (Wd.titleT > 0) Wd.titleT -= dt;
    if (Wd.shake > 0) Wd.shake = Math.max(0, Wd.shake - dt * 6);
    const baseGlitch = Wd.room.glitch || 0;
    if (Wd.glitch > baseGlitch) Wd.glitch = Math.max(baseGlitch, Wd.glitch - dt * 0.8); else Wd.glitch = baseGlitch;

    // movement
    let mx = (I.held.right ? 1 : 0) - (I.held.left ? 1 : 0);
    let my = (I.held.down ? 1 : 0) - (I.held.up ? 1 : 0);
    const run = I.held.run;
    const sp = (run ? 100 : 62) * dt;
    if (mx || my) {
      if (mx && my) { mx *= 0.7071; my *= 0.7071; }
      if (Math.abs(mx) > Math.abs(my) + 0.01) p.dir = mx < 0 ? 2 : 3; else if (my) p.dir = my < 0 ? 1 : 0; else p.dir = mx < 0 ? 2 : 3;
      moveEnt(p, mx * sp, my * sp);
      p.anim += dt * (run ? 10 : 7); p.moving = true;
      Wd.stepT += dt; if (Wd.stepT > (run ? 0.22 : 0.3)) { Wd.stepT = 0; IS.A.sfx('step'); }
    } else { p.moving = false; p.anim = 0; }

    // exits
    const ftx = Math.floor(p.x / T), fty = Math.floor((p.y - 2) / T);
    for (const ex of Wd.room.exits || []) {
      if (ex.x !== ftx || ex.y !== fty) continue;
      if (ex.if && !IS.G.ok(ex.if)) {
        // bounce back and explain
        const [dx, dy] = DIRS[p.dir]; p.x -= dx * 6; p.y -= dy * 6;
        if (ex.lock) IS.D.run({ lines: [].concat(ex.lock) });
        return;
      }
      if (ex.scene) { const [dx, dy] = DIRS[p.dir]; p.x -= dx * 6; p.y -= dy * 6; IS.D.run(ex.scene); return; }
      IS.A.sfx('door');
      S.time = Math.min(IS.DAY_END - 1, S.time + 1);
      Wd.enter(ex.to, ex.tx, ex.ty, ex.dir);
      return;
    }
    // trigger zones
    for (const tr of Wd.room.triggers || []) {
      if (ftx >= tr.x && ftx < tr.x + (tr.w || 1) && fty >= tr.y && fty < tr.y + (tr.h || 1) && IS.G.ok(tr.if) && !IS.G.has('L.seen.' + tr.scene)) {
        IS.D.run(tr.scene); return;
      }
    }

    if (I.pressed.ok) { Wd.interact(); }

    // NPC idle / wander
    for (const n of Wd.npcs) {
      n.wt -= dt;
      if (n.wander) {
        if (n.wt <= 0) {
          n.wt = 1.5 + Math.random() * 2.5;
          const d = Math.floor(Math.random() * 5);
          if (d < 4) { n.vx = DIRS[d][0] * 22; n.vy = DIRS[d][1] * 22; n.dir = d; } else { n.vx = n.vy = 0; }
        }
        if (Math.abs(n.x - (n.hx * T + 8)) > 28) n.vx = (n.hx * T + 8 - n.x) > 0 ? 22 : -22;
        if (Math.abs(n.y - (n.hy * T + 13)) > 20) n.vy = (n.hy * T + 13 - n.y) > 0 ? 22 : -22;
        if (n.vx || n.vy) { const ox = n.x, oy = n.y; moveEnt(n, n.vx * dt, n.vy * dt); n.anim += dt * 6; if (ox === n.x && oy === n.y) { n.vx = n.vy = 0; } }
        else n.anim = 0;
      } else if (n.wt <= 0) { n.wt = 3; n.dir = n.baseDir; }
    }

    // particles: dust motes in sunlight
    if (Wd.room.theme !== 'sub' && Wd.parts.length < 24 && Math.random() < dt * 6) {
      Wd.parts.push({ x: Wd.cam.x + Math.random() * IS.W, y: Wd.cam.y + Math.random() * IS.H, life: 4 + Math.random() * 4, vx: (Math.random() - 0.5) * 4, vy: -2 - Math.random() * 3 });
    }
    for (const q of Wd.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    Wd.parts = Wd.parts.filter((q) => q.life > 0);

    // clock
    Wd.tickClock(dt);
  };

  Wd.tickClock = function (dt) {
    const S = IS.S;
    if (Wd.room.timeless) return;
    const before = S.time;
    const rate = IS.settings.flow === 2 ? 0.6 : 1.25; // game minutes per real second
    S.time += dt * rate;
    S.playMs += dt * 1000;
    for (const b of IS.data.bells) if (before < b[0] && S.time >= b[0]) { IS.A.sfx('bell'); IS.UI.toast('♪ ' + b[1]); }
    if (Math.floor(before) !== Math.floor(S.time)) {
      Wd.schedT++;
      if (Wd.schedT >= 2) { Wd.schedT = 0; Wd.placeNPCs(false); Wd.music(); }
      IS.G.checkAch();
    }
    if (S.time >= IS.DAY_END - 6 && S.phase >= 2) Wd.glitch = Math.max(Wd.glitch, (S.time - (IS.DAY_END - 6)) / 6);
    if (S.time >= IS.DAY_END) { S.time = IS.DAY_END; IS.pendingMidnight = true; }
  };

  // ---------- draw ----------
  Wd.draw = function (c) {
    const r = Wd.room, p = Wd.p, S = IS.S;
    const pw = r.w * T, ph = r.h * T;
    IS.Art.night = S.time >= 1170;
    Wd.cam.x = pw <= IS.W ? (pw - IS.W) / 2 : IS.clamp(p.x - IS.W / 2, 0, pw - IS.W);
    Wd.cam.y = ph <= IS.H ? (ph - IS.H) / 2 : IS.clamp(p.y - 8 - IS.H / 2, 0, ph - IS.H);
    let ox = Math.round(-Wd.cam.x), oy = Math.round(-Wd.cam.y);
    if (Wd.shake > 0) { ox += Math.round((Math.random() - 0.5) * Wd.shake * 4); oy += Math.round((Math.random() - 0.5) * Wd.shake * 4); }
    c.fillStyle = r.theme === 'sub' || r.theme === 'anomaly' ? '#05070a' : '#140f1a';
    c.fillRect(0, 0, IS.W, IS.H);
    const x0 = Math.max(0, Math.floor(-ox / T)), y0 = Math.max(0, Math.floor(-oy / T));
    const x1 = Math.min(r.w, x0 + Math.ceil(IS.W / T) + 2), y1 = Math.min(r.h, y0 + Math.ceil(IS.H / T) + 2);
    for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) {
      IS.Art.tile(c, Wd.grid[ty][tx], tx * T + ox, ty * T + oy, tx, ty, r.theme, Wd.tileAt(tx, ty + 1), Wd.t);
    }
    // interactable hints (unread things sparkle)
    if (IS.settings.hints) for (const o of r.obj || []) {
      if (!o.hint) continue;
      const e = IS.D.pick(o.d); if (!e || !e.id || IS.G.has('seen.' + e.id) || IS.G.has('L.seen.' + e.id)) continue;
      const s = Math.sin(Wd.t * 4 + o.x) > 0.6;
      if (s) { c.fillStyle = '#fff6c8'; c.fillRect(o.x * T + ox + 7, o.y * T + oy + 2, 2, 2); c.fillRect(o.x * T + ox + 6, o.y * T + oy + 3, 4, 0.5); }
    }
    // entities, depth sorted
    const ents = Wd.npcs.map((n) => ({ y: n.y, n })).concat([{ y: p.y, me: true }]).sort((a, b) => a.y - b.y);
    for (const e of ents) {
      if (e.me) { IS.Art.char(c, IS.Art.PLAYER, p.x + ox, p.y + oy, p.dir, p.moving ? (Math.floor(p.anim) % 2) : 0); continue; }
      const n = e.n, d = IS.data.npcs[n.id];
      if (!d) continue;
      const ghost = n.ghost || d.ghost;
      IS.Art.char(c, d.look, n.x + ox, n.y + oy, n.dir, (n.vx || n.vy) ? Math.floor(n.anim) % 2 : 0,
        ghost ? { alpha: 0.55 + Math.sin(Wd.t * 2) * 0.15, glow: true } : null);
    }
    // dust motes
    c.fillStyle = 'rgba(255,240,200,0.35)';
    for (const q of Wd.parts) c.fillRect(Math.round(q.x - Wd.cam.x), Math.round(q.y - Wd.cam.y), 1, 1);

    Wd.lighting(c, ox, oy);
  };

  Wd.lighting = function (c, ox, oy) {
    const S = IS.S, r = Wd.room, t = S.time;
    let tint = null, dark = 0;
    if (r.theme === 'sub') dark = 0.6;
    else if (r.theme === 'anomaly') tint = 'rgba(40,120,140,0.12)';
    else if (t < 540) tint = 'rgba(255,190,140,0.08)';
    else if (t >= 1020 && t < 1140) tint = 'rgba(255,140,60,0.14)';
    else if (t >= 1140 && t < 1260) { tint = 'rgba(70,40,130,0.22)'; dark = 0.15; }
    else if (t >= 1260) { tint = 'rgba(20,20,70,0.3)'; dark = r.outdoor ? 0.35 : 0.5; }
    if (tint) { c.fillStyle = tint; c.fillRect(0, 0, IS.W, IS.H); }
    if (dark > 0) {
      const g = c.createRadialGradient(Wd.p.x + ox, Wd.p.y + oy - 8, 10, Wd.p.x + ox, Wd.p.y + oy - 8, 110);
      g.addColorStop(0, 'rgba(0,0,10,0)'); g.addColorStop(1, 'rgba(0,0,10,' + dark + ')');
      c.fillStyle = g; c.fillRect(0, 0, IS.W, IS.H);
    }
    // vignette
    const v = c.createRadialGradient(IS.W / 2, IS.H / 2, IS.H * 0.45, IS.W / 2, IS.H / 2, IS.W * 0.62);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.38)');
    c.fillStyle = v; c.fillRect(0, 0, IS.W, IS.H);
    if (Wd.fade > 0) { c.fillStyle = 'rgba(0,0,0,' + Wd.fade + ')'; c.fillRect(0, 0, IS.W, IS.H); }
  };

  // horizontal slice displacement: the "reality is tearing" effect
  Wd.postGlitch = function (canvas, ctx, amount) {
    const fx = IS.settings.fx; if (!fx || amount <= 0.02) return;
    const a = amount * (fx === 1 ? 0.35 : 1);
    const n = Math.floor(a * 7);
    for (let i = 0; i < n; i++) {
      const y = Math.floor(Math.random() * IS.H), h = 2 + Math.floor(Math.random() * 8);
      const dx = Math.round((Math.random() - 0.5) * 18 * a);
      ctx.drawImage(canvas, 0, y, IS.W, h, dx, y, IS.W, h);
    }
    if (fx === 2 && Math.random() < a * 0.3) { ctx.fillStyle = 'rgba(120,240,255,' + (0.08 * a).toFixed(3) + ')'; ctx.fillRect(0, 0, IS.W, IS.H); }
  };

  IS.Wd = Wd;
})(window.IS);

</script>
<script>/* src/ui.js */
// UI layer: drawing helpers, toasts, and every scene (title, world, dialogue,
// notebook/evidence board, menus, settings, endings). UI draws in a 320x180
// virtual space on the full-resolution canvas so text stays crisp.
(function (IS) {
  const UI = { toasts: [] };
  const I = () => IS.I;

  UI.col = function () {
    const hc = IS.settings.contrast;
    return {
      ink: hc ? '#ffffff' : '#f1e9d2', dim: hc ? '#d0d0d0' : '#a49ab4', bg: hc ? 'rgba(0,0,0,0.97)' : 'rgba(17,13,27,0.93)',
      edge: hc ? '#ffffff' : '#d9cfb6', acc: hc ? '#ffd84a' : '#e8b84a', red: '#e0675d', teal: '#7fd3dc', sel: hc ? 'rgba(255,216,74,0.25)' : 'rgba(232,184,74,0.16)'
    };
  };
  UI.fs = (n) => n + (IS.settings.big ? 2 : 0);
  UI.font = function (c, px) {
    if (IS.settings.plain) c.font = Math.round(UI.fs(px) * 0.78 * 10) / 10 + 'px system-ui, -apple-system, Segoe UI, sans-serif';
    else if (IS.fontFallback) c.font = Math.round(UI.fs(px) * 0.8 * 10) / 10 + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace'; // VT323 unavailable offline
    else c.font = UI.fs(px) + 'px VT323, monospace';
  };
  UI.text = function (c, s, x, y, col, px, align) {
    UI.font(c, px || 11); c.fillStyle = col || UI.col().ink; c.textAlign = align || 'left'; c.textBaseline = 'top';
    c.fillText(s, x, y);
  };
  UI.wrap = function (c, s, maxW, px) {
    UI.font(c, px || 11);
    const out = [];
    for (const para of String(s).split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        const tryL = line ? line + ' ' + w : w;
        if (c.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL;
      }
      out.push(line);
    }
    return out;
  };
  UI.panel = function (c, x, y, w, h, opts) {
    const k = UI.col();
    c.fillStyle = k.bg; c.fillRect(x, y, w, h);
    c.strokeStyle = (opts && opts.edge) || k.edge; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
  };
  // generic vertical list; returns nothing, just draws
  UI.list = function (c, items, sel, x, y, w, rowH, opts) {
    const k = UI.col(); opts = opts || {};
    const inkC = opts.ink || k.ink, dimC = opts.dim || k.dim, accC = opts.acc || k.acc;
    const max = opts.max || 99, start = Math.max(0, Math.min(sel - Math.floor(max / 2), items.length - max));
    for (let i = start; i < Math.min(items.length, start + max); i++) {
      const yy = y + (i - start) * rowH, it = items[i];
      const label = typeof it === 'string' ? it : it.label;
      const dis = it && it.disabled;
      if (i === sel) { c.fillStyle = opts.selBg || k.sel; c.fillRect(x - 2, yy - 1, w, rowH); UI.text(c, '▸', x, yy, accC, opts.px); }
      UI.text(c, label, x + 9, yy, dis ? dimC : (i === sel ? accC : inkC), opts.px);
      if (it && it.right) UI.text(c, it.right, x + w - 6, yy, i === sel ? accC : dimC, opts.px, 'right');
    }
    if (start > 0) UI.text(c, '▲', x + w - 8, y - 9, dimC, 9);
    if (start + max < items.length) UI.text(c, '▼', x + w - 8, y + max * rowH - 2, dimC, 9);
  };
  UI.navList = function (sel, n) {
    if (n <= 0) return 0;
    if (I().rep('up')) { sel = (sel - 1 + n) % n; IS.A.sfx('select'); }
    if (I().rep('down')) { sel = (sel + 1) % n; IS.A.sfx('select'); }
    return sel;
  };

  UI.toast = function (text, kind) { UI.toasts.push({ text, kind: kind || 'info', t: 0 }); if (UI.toasts.length > 5) UI.toasts.shift(); };
  UI.drawToasts = function (c, dt) {
    const k = UI.col();
    let y = 26;
    for (const t of UI.toasts) {
      t.t += dt;
      const a = t.t < 0.25 ? t.t / 0.25 : t.t > 3.2 ? Math.max(0, 1 - (t.t - 3.2) / 0.5) : 1;
      c.globalAlpha = a;
      UI.font(c, 10);
      const w = Math.min(190, c.measureText(t.text).width + 14);
      const x = IS.W - w - 6 + (1 - a) * 20;
      const col = t.kind === 'clue' ? k.teal : t.kind === 'ach' ? k.acc : t.kind === 'bond' ? k.red : k.ink;
      UI.panel(c, x, y, w, 14, { edge: col });
      UI.text(c, t.text, x + 7, y + 2, col, 10);
      c.globalAlpha = 1; y += 17;
    }
    UI.toasts = UI.toasts.filter((t) => t.t < 3.7);
  };

  // =============== dialogue ===============
  const D = {};
  D.ok = (c) => IS.G.ok(c);
  // resolve a scene id: dynamic scenes pick from a conditional list each time
  D.scene = function (id) {
    const dl = IS.data.dynamicScenes && IS.data.dynamicScenes[id];
    if (dl) return D.pick(IS.data[dl]);
    const e = IS.data.scenes[id]; if (e && !e.id) e.id = id;
    return e || null;
  };
  D.pick = function (list) {
    if (!list) return null;
    if (typeof list === 'string') return D.scene(list);
    if (!Array.isArray(list)) return list;
    for (const e of list) {
      if (!IS.G.ok(e.if)) continue;
      if (e.once && e.id && IS.G.has('L.seen.' + e.id)) continue;
      if (e.onceEver && e.id && IS.G.has('seen.' + e.id)) continue;
      return e;
    }
    return null;
  };
  D.run = function (entry, npc) {
    if (typeof entry === 'string') entry = D.scene(entry);
    if (!entry) return false;
    IS.push(new DialogueScene(entry, npc)); return true;
  };
  D.sub = function (s) {
    const S = IS.S;
    return s.replace(/\{name\}/g, S.name).replace(/\{loop\}/g, S.loop).replace(/\{time\}/g, IS.fmtTime(S.time));
  };
  function parseLine(l) {
    const m = /^@(\w+)\s+([\s\S]*)$/.exec(l);
    return m ? { sp: m[1], text: D.sub(m[2]) } : { sp: null, text: D.sub(l) };
  }
  IS.D = D;

  class DialogueScene {
    constructor(entry, npc) { this.npc = npc; this.goto = null; this.start(entry); }
    start(e) {
      this.entry = e;
      if (e.id) { IS.G.set('L.seen.' + e.id); if (e.onceEver) IS.G.set('seen.' + e.id); IS.G.set('seen.' + e.id); }
      if (this.npc) IS.G.set('met.' + this.npc.id);
      let lines = e.lines;
      if (e.pool) lines = e.pool[Math.floor(IS.loopRand((e.id || 'pool') + 'p') * e.pool.length)];
      this.queue = (lines || []).map(parseLine);
      this.doFx = e.do; this.choiceList = e.choices; this.goto = e.goto || null;
      this.choices = null; this.line = null;
      this.next();
    }
    next() {
      if (this.queue.length) { this.line = this.queue.shift(); this.shown = 0; this.blipT = 0; return; }
      if (this.doFx) { const f = this.doFx; this.doFx = null; IS.G.apply(f); }
      if (this.choiceList) {
        const cs = this.choiceList.filter((ch) => IS.G.ok(ch.if)); this.choiceList = null;
        if (cs.length) { this.choices = cs; this.sel = 0; if (this.line) this.shown = 1e9; return; }
      }
      if (this.goto) { const g = this.goto; this.goto = null; const e = D.scene(g); if (e) return this.start(e); }
      IS.pop();
    }
    choose(ch) {
      IS.A.sfx('confirm'); this.choices = null;
      this.queue = (ch.lines || []).map(parseLine);
      this.doFx = ch.do; this.choiceList = ch.choices || null; this.goto = ch.goto || null;
      this.line = null; this.next();
    }
    update(dt) {
      const In = I();
      if (this.choices) {
        this.sel = UI.navList(this.sel, this.choices.length);
        if (In.pressed.ok) this.choose(this.choices[this.sel]);
        return;
      }
      if (!this.line) return;
      const speeds = [28, 50, 95, 1e6];
      const len = this.line.text.length;
      const prev = Math.floor(this.shown);
      this.shown = Math.min(len, this.shown + speeds[IS.settings.textSpeed] * dt);
      if (Math.floor(this.shown) > prev && Math.floor(this.shown) % 2 === 0 && this.line.text[Math.floor(this.shown) - 1] !== ' ') {
        const n = this.line.sp && (IS.data.npcs[this.line.sp] || IS.data.speakers[this.line.sp]);
        IS.A.sfx('blip', n ? n.voice : (this.line.sp === 'you' ? 700 : 420));
      }
      if (In.pressed.ok || In.pressed.back) {
        if (this.shown < len) this.shown = len; else { IS.A.sfx('select'); this.next(); }
      }
    }
    drawUI(c) {
      const k = UI.col();
      const ln = this.line;
      const bx = 8, by = 124, bw = 304, bh = 50;
      if (ln) {
        UI.panel(c, bx, by, bw, bh);
        let tx = bx + 10;
        const sp = ln.sp, npc = sp && IS.data.npcs[sp], spk = sp && IS.data.speakers[sp];
        if (npc || spk || sp === 'you') {
          const look = npc ? npc.look : sp === 'you' ? IS.Art.PLAYER : null;
          const img = IS.Art.portrait(sp, look, spk && spk.portrait);
          c.fillStyle = 'rgba(255,255,255,0.05)'; c.fillRect(bx + 6, by + 6, 38, 38);
          c.imageSmoothingEnabled = false;
          if (npc && npc.ghost) c.globalAlpha = 0.7;
          c.drawImage(img, bx + 7, by + 7, 36, 36); c.globalAlpha = 1;
          tx = bx + 52;
          const name = npc ? npc.name : spk ? spk.name : IS.S.name;
          UI.font(c, 10); const nw = c.measureText(name).width + 12;
          UI.panel(c, bx + 4, by - 12, nw, 13, { edge: k.acc });
          UI.text(c, name, bx + 10, by - 11, k.acc, 10);
        }
        const lines = UI.wrap(c, ln.text, bw - (tx - bx) - 10, 11);
        let left = Math.floor(this.shown);
        lines.slice(0, 4).forEach((l, i) => {
          const part = l.slice(0, Math.max(0, left)); left -= l.length + 1;
          UI.text(c, part, tx, by + 6 + i * 10.5, sp ? k.ink : '#d8d0e8', 11);
        });
        if (!this.choices && this.shown >= ln.text.length && Math.floor(performance.now() / 400) % 2) UI.text(c, '▼', bx + bw - 12, by + bh - 11, k.acc, 9);
      }
      if (this.choices) {
        UI.font(c, 11);
        const w = Math.min(240, Math.max(...this.choices.map((ch) => c.measureText(ch.t).width)) + 26);
        const h = this.choices.length * 12 + 8;
        const x = IS.W - w - 10, y = (ln ? by : 170) - h - 4;
        UI.panel(c, x, y, w, h, { edge: k.acc });
        UI.list(c, this.choices.map((ch) => ch.t), this.sel, x + 6, y + 4, w - 8, 12);
      }
    }
  }
  UI.DialogueScene = DialogueScene;

  // =============== world ===============
  class WorldScene {
    update(dt) {
      if (IS.top() !== this) return;
      const S = IS.S;
      if (IS.pendingEnding) { const e = IS.pendingEnding; IS.pendingEnding = null; IS.push(new EndingScene(e)); return; }

      if (IS.pendingCard) { const cd = IS.pendingCard; IS.pendingCard = null; IS.push(new CardScene(cd)); return; }

  // =============== title & new game ===============
  class TitleScene {
    constructor() { this.sel = 0; this.t = 0; this.motes = []; IS.A.play('title'); this.build(); }
    build() {
      const latest = latestSave();
      this.items = [];
      if (latest) this.items.push({ label: 'Continue', act: () => { IS.G.load(latest); UI.startWorld(); } });
      this.items.push({ label: 'New Game', act: () => IS.push(new NameScene()) });
      this.items.push({ label: 'Load Game', act: () => IS.push(new SlotScene('load')) });
      this.items.push({ label: 'Settings', act: () => IS.push(new SettingsScene()) });
      this.items.push({ label: 'Extras', act: () => IS.push(new ExtrasScene()) });
    }
    enter() { this.build(); }
    update(dt) {
      this.t += dt;
      if (IS.top() !== this) return;
      this.sel = UI.navList(this.sel, this.items.length);
      if (I().pressed.ok) { IS.A.sfx('confirm'); this.items[this.sel].act(); }
    }
    drawLo(c) {
      const t = this.t;
      const g = c.createLinearGradient(0, 0, 0, IS.H); g.addColorStop(0, '#0c0a16'); g.addColorStop(1, '#1d1430');
      c.fillStyle = g; c.fillRect(0, 0, IS.W, IS.H);
      // endless corridor of lockers receding
      for (let i = 0; i < 9; i++) {
        const z = ((i + t * 0.25) % 9) / 9, s = 1 - z;
        const w = 300 * s * s + 10, h = 150 * s * s + 6, x = IS.W / 2 - w / 2, y = 96 - h / 2;
        c.strokeStyle = 'rgba(160,140,200,' + (0.05 + s * 0.22).toFixed(3) + ')'; c.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w), Math.round(h));
      }
      // clock
      const cx = IS.W / 2, cy = 96;
      c.fillStyle = '#e8dcc0'; c.beginPath(); c.arc(cx, cy, 15, 0, 7); c.fill();
      c.fillStyle = '#1a1424'; c.beginPath(); c.arc(cx, cy, 13, 0, 7); c.fill();
      c.fillStyle = '#e8dcc0';
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; c.fillRect(Math.round(cx + Math.cos(a) * 11), Math.round(cy + Math.sin(a) * 11), 1, 1); }
      const sec = (t * 0.9) % 1, jitter = sec > 0.92 ? Math.sin(t * 60) * 0.03 : 0;
      const hand = (a, l, col) => { c.strokeStyle = col; c.lineWidth = 1; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a - Math.PI / 2) * l, cy + Math.sin(a - Math.PI / 2) * l); c.stroke(); };
      hand((11 + 59 / 60) / 12 * Math.PI * 2, 7, '#e8dcc0');
      hand(59 / 60 * Math.PI * 2 + jitter, 10, '#e8dcc0');
      hand((0.98 + sec * 0.019) * Math.PI * 2, 11, '#e0675d');
      if (Math.random() < 0.04) IS.Wd.postGlitch(c.canvas, c, 0.6);
    }
    drawUI(c) {
      const k = UI.col();
      UI.text(c, 'INFINITE', IS.W / 2, 14, k.ink, 30, 'center');
      UI.text(c, 'S C H O O L', IS.W / 2, 40, k.acc, 15, 'center');
      UI.text(c, 'Thursday never ends.', IS.W / 2, 57, k.dim, 10, 'center');
      const w = 110, x = IS.W / 2 - w / 2, y = 118;
      UI.list(c, this.items, this.sel, x + 8, y, w, 11);
      UI.text(c, 'v' + IS.VERSION, 6, IS.H - 12, k.dim, 9);
      const hint = I().mode === 'pad' ? 'A select · B back' : I().mode === 'touch' ? 'Tap A to select' : 'Arrows move · Enter selects';
      UI.text(c, hint, IS.W - 6, IS.H - 12, k.dim, 9, 'right');
    }
  }

  function latestSave() {
    let best = null, bt = 0;
    for (const s of ['auto', 1, 2, 3]) { const d = IS.G.slot(s); if (d && (d.savedAt || 0) > bt) { bt = d.savedAt; best = s; } }
    return best;
  }

  class NameScene {
    constructor() {
      this.name = ''; this.r = 0; this.c = 0;
      this.grid = ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZ-\'. ', ['DEL', 'RANDOM', 'DONE']];
    }
    enter() { I().textMode = true; I().typed.length = 0; }
    exit() { I().textMode = false; }
    update(dt) {
      const In = I();
      for (const ch of In.typed) {
        if (ch === '\b') this.name = this.name.slice(0, -1);
        else if (/^[A-Za-z\-'. ]$/.test(ch) && this.name.length < 10) this.name += this.name.length ? ch.toLowerCase() : ch.toUpperCase();
      }
      In.typed.length = 0;
      const row = this.grid[this.r], len = row.length;
      if (In.rep('left')) { this.c = (this.c - 1 + len) % len; IS.A.sfx('select'); }
      if (In.rep('right')) { this.c = (this.c + 1) % len; IS.A.sfx('select'); }
      if (In.rep('up')) { this.r = (this.r + 3) % 4; this.c = Math.min(this.c, this.grid[this.r].length - 1); IS.A.sfx('select'); }
      if (In.rep('down')) { this.r = (this.r + 1) % 4; this.c = Math.min(this.c, this.grid[this.r].length - 1); IS.A.sfx('select'); }
      if (In.pressed.menu) { IS.pop(); return; }
      if (In.pressed.back) { if (this.name) this.name = this.name.slice(0, -1); else IS.pop(); IS.A.sfx('back'); return; }
      if (In.pressed.ok) {
        const v = this.grid[this.r][this.c];
        if (v === 'DEL') this.name = this.name.slice(0, -1);
        else if (v === 'RANDOM') { const pool = ['Ash', 'Rowan', 'Kit', 'Sol', 'Juno', 'Ezra', 'Wren', 'Nico', 'Sage', 'Indy']; this.name = pool[Math.floor(Math.random() * pool.length)]; }
        else if (v === 'DONE') { IS.A.sfx('confirm'); begin(this.name.trim() || 'Ash'); return; }
        else if (this.name.length < 10) this.name += this.name.length ? v.toLowerCase() : v;
        IS.A.sfx('select');
      }
    }
    drawUI(c) {
      const k = UI.col();
      c.fillStyle = '#0c0a16'; c.fillRect(0, 0, IS.W, IS.H);
      UI.text(c, 'Sign the attendance sheet:', IS.W / 2, 22, k.dim, 11, 'center');
      UI.panel(c, IS.W / 2 - 70, 40, 140, 22, { edge: k.acc });
      UI.text(c, (this.name || '') + (Math.floor(performance.now() / 400) % 2 ? '_' : ' '), IS.W / 2, 43, k.ink, 16, 'center');
      for (let r = 0; r < 4; r++) {
        const row = this.grid[r];
        for (let i = 0; i < row.length; i++) {
          const wide = r === 3, cw = wide ? 60 : 20;
          const x = IS.W / 2 - (row.length * cw) / 2 + i * cw + cw / 2, y = 78 + r * 18;
          const on = r === this.r && i === this.c;
          if (on) { c.fillStyle = k.sel; c.fillRect(x - cw / 2 + 2, y - 2, cw - 4, 15); }
          UI.text(c, row[i] === ' ' ? '␣' : row[i], x, y, on ? k.acc : k.ink, 12, 'center');
        }
      }
      UI.text(c, 'Type, or pick letters. Blank = Ash', IS.W / 2, 160, k.dim, 9, 'center');
    }
  }

        { label: 'Notebook', act: () => { IS.pop(); IS.push(new NotebookScene()); } },

        { label: 'Load Game', act: () => IS.push(new SlotScene('load')) },

      if (this.sub) {
        UI.panel(c, 60, 60, 200, this.sub.length * 11 + 20, { edge: k.acc });
        UI.text(c, 'Pass the time until…', 68, 63, k.acc, 10);
        UI.list(c, this.sub, this.ssel, 66, 76, 190, 11);
      }
    }
  }
  function waitItems() {
    const S = IS.S, list = [];
    const jump = (t) => () => {
      S.time = Math.max(S.time, t); IS.Wd.placeNPCs(true); IS.Wd.music(); IS.Wd.fade = 1;
      while (IS.top() !== IS.stack[0]) IS.pop();
    };
    const nb = IS.data.bells.find((b) => b[0] > S.time);
    list.push({ label: nb ? 'The next bell (' + IS.fmtTime(nb[0]) + ')' : 'The next bell', act: jump(nb ? nb[0] : S.time), disabled: !nb });
    [[900, 'After school'], [1080, 'Evening'], [1260, 'Night']].forEach(([t, n]) => list.push({ label: n + ' (' + IS.fmtTime(t) + ')', act: jump(t), disabled: S.time >= t }));
    list.push({ label: 'Midnight (end the day)', act: () => { while (IS.top() !== IS.stack[0]) IS.pop(); IS.pendingMidnight = true; } });
    if (S.items.includes('watch')) list.push({ label: 'Wind the Second Hand (restart now)', act: () => { while (IS.top() !== IS.stack[0]) IS.pop(); IS.pendingMidnight = true; } });
    if (IS.Wd.room && IS.Wd.room.timeless) list.forEach((x) => { x.disabled = true; });
    return list;
  }

  // =============== notebook & evidence board ===============
  const TABS = ['Goals', 'Clues', 'Board', 'People', 'Map', 'Items'];
  class NotebookScene {
    constructor(tab) { this.tab = tab || 0; this.sel = 0; this.pick = null; this.msg = null; }
    clueList() { return IS.S.clues.map((id) => Object.assign({ id }, IS.data.clues[id])); }
    people() {
      const S = IS.S;
      return Object.keys(IS.data.npcs).filter((id) => IS.data.npcs[id].profile !== false && (S.flags['met.' + id] || S.insight[id] > 0)).map((id) => Object.assign({ id }, IS.data.npcs[id]));
    }
    update() {
      const In = I();
      if (In.back() || In.pressed.note) {
        if (this.pick != null && this.tab === 2 && !In.pressed.note) { this.pick = null; IS.A.sfx('back'); return; }
        IS.A.sfx('back'); IS.pop(); return;
      }
      if (In.rep('left')) { this.tab = (this.tab + TABS.length - 1) % TABS.length; this.sel = 0; this.pick = null; IS.A.sfx('select'); }
      if (In.rep('right')) { this.tab = (this.tab + 1) % TABS.length; this.sel = 0; this.pick = null; IS.A.sfx('select'); }
      const n = this.tab === 1 || this.tab === 2 ? IS.S.clues.length : this.tab === 3 ? this.people().length : this.tab === 5 ? IS.S.items.length : 0;
      this.sel = UI.navList(this.sel, n);
      if (this.tab === 1 && n) delete IS.S.newClues[IS.S.clues[this.sel]];
      if (this.tab === 2 && In.pressed.ok && n) {
        const id = IS.S.clues[this.sel];
        if (this.pick == null) { this.pick = id; IS.A.sfx('confirm'); }
        else if (this.pick === id) { this.pick = null; IS.A.sfx('back'); }
        else {
          const r = IS.G.deduce(this.pick, id);
          this.pick = null;
          if (r && r.ok) { IS.pop(); IS.D.run({ lines: ['DEDUCTION — ' + r.d.title.toUpperCase(), r.d.text] }); return; }
          else if (r && r.already) { this.msg = 'You already worked that out: ' + r.d.title + '.'; IS.A.sfx('select'); }
          else { this.msg = "These don't connect. Not yet."; IS.A.sfx('wrong'); }
        }
      }
    }
    drawUI(c) {
      const k = UI.col(), S = IS.S;
      c.fillStyle = 'rgba(5,4,10,0.6)'; c.fillRect(0, 0, IS.W, IS.H);
      // paper notebook
      c.fillStyle = IS.settings.contrast ? '#000' : '#efe6cf'; c.fillRect(10, 10, 300, 160);
      c.fillStyle = IS.settings.contrast ? '#000' : '#e2d6b8'; for (let y = 34; y < 168; y += 11) c.fillRect(12, y, 296, 0.5);
      c.fillStyle = '#c0574d'; c.fillRect(34, 10, 0.6, 160);
      const ink = IS.settings.contrast ? '#fff' : '#2a2238', faint = IS.settings.contrast ? '#ccc' : '#7a6f88', red = '#b5433a';
      TABS.forEach((t, i) => {
        const x = 40 + i * 44;
        if (i === this.tab) { c.fillStyle = k.acc; c.fillRect(x - 3, 13, 42, 13); }
        UI.text(c, t, x + 18, 13, i === this.tab ? '#1a1424' : faint, 11, 'center');
      });
      UI.text(c, '◀ ▶', 300, 14, faint, 9, 'right');
      const L = 40, Y = 34;
      const P = { ink, dim: faint, acc: red, selBg: 'rgba(181,67,58,0.12)' };
      if (this.tab === 0) {
        const goal = IS.data.objectives.find((o) => IS.G.ok(o.if));
        UI.text(c, 'CURRENT LEAD', L, Y, red, 10);
        UI.wrap(c, goal ? goal.text : 'Keep exploring.', 255, 11).forEach((l, i) => UI.text(c, l, L, Y + 11 + i * 11, ink, 11));
        UI.text(c, 'Phase ' + S.phase + ' — ' + (IS.data.phases[S.phase] || ''), L, Y + 56, ink, 11);
        UI.text(c, 'Loop ' + S.loop + '   ·   ' + S.clues.length + ' clues   ·   ' + IS.data.deductions.filter((d) => IS.G.has('d.' + d.id)).length + ' deductions', L, Y + 67, faint, 10);
        UI.text(c, 'Tip: connect two clues on the Board to make a deduction.', L, Y + 89, faint, 10);
        UI.text(c, 'What you learn survives midnight. What you carry does not.', L, Y + 100, faint, 10);
      } else if (this.tab === 1 || this.tab === 2) {
        const list = this.clueList();
        if (!list.length) { UI.text(c, 'Nothing written yet. Look around. Talk to people.', L, Y, faint, 11); return; }
        const items = list.map((cl) => ({ label: (S.newClues[cl.id] ? '• ' : '') + cl.title + (this.pick === cl.id ? '  ✱' : '') }));
        UI.list(c, items, this.sel, L - 6, Y, 128, 11, Object.assign({ max: 11 }, P));
        const cl = list[this.sel];
        c.fillStyle = IS.settings.contrast ? '#000' : '#efe6cf'; c.fillRect(170, 32, 136, 134);
        UI.text(c, (cl.cat || '').toUpperCase(), 174, Y, red, 9);
        UI.wrap(c, cl.title, 128, 12).forEach((l, i) => UI.text(c, l, 174, Y + 9 + i * 11, ink, 12));
        UI.wrap(c, cl.text, 128, 10).slice(0, 9).forEach((l, i) => UI.text(c, l, 174, Y + 32 + i * 10, ink, 10));
        if (this.tab === 2) {
          const made = IS.data.deductions.filter((d) => IS.G.has('d.' + d.id));
          c.fillStyle = IS.settings.contrast ? '#000' : '#efe6cf'; c.fillRect(170, 128, 136, 38);
          UI.text(c, this.pick ? 'Now pick a second clue…' : 'Pick a clue to pin.', 174, 130, red, 10);
          UI.text(c, this.msg || ('Red string tied: ' + made.length + ' / ' + IS.data.deductions.length), 174, 142, faint, 9);
          if (made.length) UI.text(c, 'Latest: ' + made[made.length - 1].title, 174, 152, ink, 9);
        }
      } else if (this.tab === 3) {
        const ps = this.people();
        if (!ps.length) { UI.text(c, 'You have not really met anyone yet.', L, Y, faint, 11); return; }
        UI.list(c, ps.map((p) => p.short || p.name), this.sel, L - 6, Y, 90, 11, Object.assign({ max: 11 }, P));
        const p = ps[Math.min(this.sel, ps.length - 1)];
        c.fillStyle = IS.settings.contrast ? '#000' : '#efe6cf'; c.fillRect(132, 32, 174, 134);
        c.imageSmoothingEnabled = false; c.drawImage(IS.Art.portrait(p.id, p.look), 136, Y, 28, 28);
        UI.text(c, p.name, 170, Y, ink, 12); UI.text(c, p.role || '', 170, Y + 11, faint, 10);
        const b = S.bonds[p.id] || 0;
        UI.text(c, '♥'.repeat(b) + '♡'.repeat(5 - b) + (IS.G.isAware(p.id) ? '   remembers you' : ''), 170, Y + 21, red, 10);
        let yy = Y + 36;
        for (const note of p.notes || []) {
          if (!IS.G.ok(note.if)) continue;
          for (const l of UI.wrap(c, '— ' + note.text, 168, 10)) { if (yy > 160) break; UI.text(c, l, 136, yy, ink, 10); yy += 10; }
        }
      } else if (this.tab === 4) {
        const floors = {};
        for (const id in IS.data.rooms) { const r = IS.data.rooms[id]; const f = r.floor || '?'; (floors[f] = floors[f] || []).push(Object.assign({ id }, r)); }
        let x = L, yy = Y;
        for (const f of ['2F', '1F', 'Grounds', 'Hidden', 'Below']) {
          if (!floors[f]) continue;
          const vis = floors[f].filter((r) => S.visited[r.id]);
          if (!vis.length && (f === 'Hidden' || f === 'Below')) continue;
          UI.text(c, f, x, yy, red, 10); yy += 10;
          for (const r of floors[f]) {
            const seen = S.visited[r.id];
            if (!seen && r.secret) continue;
            UI.text(c, (r.id === S.room ? '◉ ' : seen ? '· ' : '? ') + (seen ? r.name : '???'), x + 4, yy, r.id === S.room ? red : seen ? ink : faint, 10); yy += 9.5;
            if (yy > 160) { yy = Y; x += 92; }
          }
          yy += 3; if (yy > 150) { yy = Y; x += 92; }
        }
      } else if (this.tab === 5) {
        if (!S.items.length) { UI.text(c, 'Your pockets are empty.', L, Y, faint, 11); return; }

        const it = IS.data.items[S.items[Math.min(this.sel, S.items.length - 1)]];

        UI.wrap(c, it.desc + (it.anchored ? '\n\n(Anchored: survives midnight.)' : ''), 140, 10).forEach((l, i) => UI.text(c, l, 164, Y + i * 10, ink, 10));
      }
    }
  }
  UI.NotebookScene = NotebookScene;

  // =============== settings ===============
  class SettingsScene {
    constructor() { this.sel = 0; this.help = false; }
    rows() {
      const s = IS.settings, pct = (v) => Math.round(v * 100) + '%', onoff = (v) => (v ? 'On' : 'Off');
      return [
        { label: 'Master volume', right: pct(s.master), adj: (d) => { s.master = IS.clamp(Math.round((s.master + d * 0.1) * 10) / 10, 0, 1); } },
        { label: 'Music', right: pct(s.music), adj: (d) => { s.music = IS.clamp(Math.round((s.music + d * 0.1) * 10) / 10, 0, 1); } },
        { label: 'Sound effects', right: pct(s.sfx), adj: (d) => { s.sfx = IS.clamp(Math.round((s.sfx + d * 0.1) * 10) / 10, 0, 1); } },
        { label: 'Text speed', right: ['Slow', 'Normal', 'Fast', 'Instant'][s.textSpeed], adj: (d) => { s.textSpeed = (s.textSpeed + d + 4) % 4; } },
        { label: 'Clock speed', right: s.flow === 2 ? 'Relaxed' : 'Normal', adj: () => { s.flow = s.flow === 2 ? 1 : 2; } },

        { label: 'CRT scanlines', right: onoff(s.crt), adj: () => { s.crt = !s.crt; } },
        { label: 'Large text', right: onoff(s.big), adj: () => { s.big = !s.big; } },
        { label: 'Plain (readable) font', right: onoff(s.plain), adj: () => { s.plain = !s.plain; } },
        { label: 'High contrast', right: onoff(s.contrast), adj: () => { s.contrast = !s.contrast; } },

        { label: 'Touch controls', right: ['Auto', 'On', 'Off'][s.touch], adj: (d) => { s.touch = (s.touch + d + 3) % 3; IS.applyTouch(); } },
        { label: 'View controls', right: '', act: () => { this.help = true; } }

    update() {
      const In = I(), rows = this.rows();

      this.sel = UI.navList(this.sel, rows.length);
      const r = rows[this.sel];
      if (In.rep('left') && r.adj) { r.adj(-1); IS.G.saveSettings(); IS.A.sfx('select'); }
      if ((In.rep('right') && r.adj) || (In.pressed.ok && r.adj)) { r.adj(1); IS.G.saveSettings(); IS.A.sfx('select'); }
      if (In.pressed.ok && r.act) r.act();
      if (In.back()) { IS.A.sfx('back'); IS.pop(); }

    drawUI(c) {
      const k = UI.col();

  // =============== save slots ===============
  class SlotScene {
    constructor(mode) { this.mode = mode; this.sel = 0; this.confirm = false; }
    slots() { return this.mode === 'load' ? ['auto', 1, 2, 3] : [1, 2, 3]; }
    update() {
      const In = I(), sl = this.slots();
      if (In.back()) { if (this.confirm) this.confirm = false; else IS.pop(); IS.A.sfx('back'); return; }
      if (!this.confirm) this.sel = UI.navList(this.sel, sl.length);
      if (In.pressed.ok) {

          if (d && !this.confirm) { this.confirm = true; IS.A.sfx('select'); return; }
          IS.G.save(s); this.confirm = false; IS.pop();
        } else {
          if (!d) { IS.A.sfx('wrong'); return; }
          IS.G.load(s); IS.A.sfx('confirm'); UI.startWorld();
        }
      }
    }
    drawUI(c) {

      UI.panel(c, 30, 24, 260, 132);
      UI.text(c, this.mode === 'save' ? 'SAVE GAME' : 'LOAD GAME', 42, 28, k.acc, 12);

      });
      if (this.confirm) UI.text(c, 'Overwrite this slot? OK to confirm, Back to cancel.', IS.W / 2, 144, k.red, 10, 'center');
    }
  }

  // =============== extras ===============
  class ExtrasScene {

      } else {

          '', 'Built with plain JavaScript + Canvas + Web Audio.', 'Thank you for staying after class.'];
        L.forEach((l, i) => UI.text(c, l, IS.W / 2, 36 + i * 13, i === 0 ? k.acc : k.ink, i === 0 ? 14 : 10, 'center'));

  }

  IS.UI = UI;
})(window.IS);

<script>/* data/world.js */
// World rules & knowledge: clues, deductions, items, phases, clock, objectives.
(function (D) {
  D.phases = { 1: 'Normal School Life', 2: 'Strange Events', 3: 'Conspiracy', 4: 'Reality Collapse', 5: 'Final Truth' };
  D.periods = [[0, 'Night'], [465, 'Homeroom'], [480, 'Morning Classes'], [720, 'Lunch'], [780, 'Afternoon Classes'], [900, 'After School'], [1080, 'Evening'], [1260, 'Night']];
  D.bells = [[480, 'First bell'], [720, 'Lunch bell'], [780, 'Afternoon bell'], [900, 'Dismissal bell']];

  // Rules evaluated every time a new loop begins
  D.loopRules = [
    { if: { loop: [3], phase: 2, not: 'theo_saved' }, do: { set: 'L.theo_missing' } }
  ];

  D.items = {
    watch: { name: 'The Second Hand', desc: "Mr. Grey's pocketwatch. It keeps your time, not the school's. From the pause menu (Wait…) you can wind it to restart the day early.", anchored: true },
    book: { name: 'The Patient Clock', desc: 'A library book. Chapter One is about a clock that refused to strike midnight. Due back today.' },
    draft: { name: "Mira's Draft #213", desc: '"Good morning, Halloway. Today is our last day. Today is our last day. Today is—" It stops there.' }
  };

  const C = (cat, title, text) => ({ cat, title, text });
  D.clues = {
    c_repeat: C('anomaly', "Mira's Words", 'Mira woke you with the exact same words as yesterday. Same pause. Same joke about ghosts.'),
    c_desk: C('anomaly', 'The Scratched Desk', "Back row of 2-B, the desk nobody uses. Carved deep: 'F.B. WAS HERE.' Below it, newer: 'F.B. IS STILL HERE.'"),
    c_welcome: C('people', 'Welcome Back', "Mrs. Vell, the librarian, greeted you with 'Welcome back, dear. The same book as last time?' You have never been in the library."),
    c_joke: C('anomaly', 'The Photocopier Joke', 'Coach Dunmore told you the same joke as yesterday, word for word. He swears he made it up this morning.'),
    c_drawing: C('places', "June's Door", 'June Sato keeps drawing a grey door with a brass plate that reads 2-F. She sees it whenever she closes her eyes.'),
    c_gap: C('places', 'The Missing Number', 'Second floor: 2-E, then a stretch of blank wall, then 2-G. The paint between them is a slightly newer shade of beige.'),
    c_calendar: C('history', 'Final Assembly', "The principal's calendar: October 14 — FINAL ASSEMBLY. HALLOWAY ACADEMY CLOSES ITS DOORS. Penciled underneath: 'again.'"),
    c_fog: C('anomaly', 'The Gate', 'Walk out the front gate and the fog walks you straight back to the front of the school.'),
    c_bell: C('anomaly', 'Chalkboard Warning', "After school, on the 2-B chalkboard, in YOUR handwriting: 'DON'T TRUST THE BELL.' You don't remember writing it."),
    c_grey: C('people', 'Mr. Grey Remembers', 'Mr. Grey has lived this Thursday since 1977. He remembers every loop. Until you, no one else did.'),
    c_meeting: C('people', 'After-Hours Meeting', "Principal Hask and Ms. Marrow, after hours: 'The Bellwether holds.' They are worried about the student who remembers."),
    c_theo_wall: C('history', "Theo's Theory Wall", "Theo's red-string wall: a 1977 fire drill where the head count came up one short. Officially, it never happened."),
    c_theo_gone: C('people', 'Nobody Remembers Theo', 'Theo Vance is gone. His seat is empty, and nobody, not even Mira, remembers he ever existed.'),
    c_tag: C('anomaly', 'Claimed by No One', "Theo's orange hoodie is in the Lost & Found box. The tag reads: 'CLAIMED BY: NO ONE.'"),
    c_room2f: C('places', 'Room 2-F', "A classroom sealed since 1977. The board says 'FIRE DRILL — 2:15 PM. WAIT FOR HEAD COUNT.' The clock is stuck at 2:14."),
    c_felix: C('people', 'Felix Bram', 'A see-through boy in a sweater vest, waiting in 2-F for a head count that never came. He thinks it is still 1977.'),
    c_yearbook: C('history', 'The 1977 Yearbook', "Mr. Grey is on the faculty page with the same face at the same age. Felix Bram, voted 'Most Likely to Stay Forever.'"),
    c_closures: C('history', 'Postponed', 'Closure notices from 1977, 1984, 1991, 2003, 2015... Each says the school closes tomorrow. Each is stamped POSTPONED.'),

<script>/* src/main.js */
// Boot + main loop. Renders the world into a 320x180 low-res buffer, scales
// it up with crisp pixels, then draws the UI at full resolution on top.
(function (IS) {
  const main = document.getElementById('game');
  const mctx = main.getContext('2d');
  const lo = document.createElement('canvas'); lo.width = IS.W; lo.height = IS.H;
  const lctx = lo.getContext('2d');
  let scale = 1, ox = 0, oy = 0, dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const w = main.clientWidth, h = main.clientHeight;
    main.width = Math.round(w * dpr); main.height = Math.round(h * dpr);
    let s = Math.min(main.width / IS.W, main.height / IS.H);
    if (s >= 2) s = Math.floor(s);
    scale = s; ox = Math.round((main.width - IS.W * s) / 2); oy = Math.round((main.height - IS.H * s) / 2);
  }
  addEventListener('resize', resize);

  IS.applyTouch = function () {
    const el = document.getElementById('touch');
    const t = IS.settings.touch;
    const auto = matchMedia('(pointer: coarse)').matches;
    el.hidden = t === 2 || (t === 0 && !auto);
  };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    IS.I.update(dt);
    const top = IS.top();
    if (top && top.update) top.update(dt);
    // the world keeps its effects alive under overlays
    const w = IS.stack[0];
    if (w instanceof IS.UI.WorldScene && top !== w) { IS.Wd.t += dt; if (IS.Wd.fade > 0) IS.Wd.fade = Math.max(0, IS.Wd.fade - dt * 3); }
    draw(dt);
    requestAnimationFrame(frame);
  }

  function draw(dt) {
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.fillStyle = '#000'; lctx.fillRect(0, 0, IS.W, IS.H);
    for (const s of IS.stack) if (s.drawLo) s.drawLo(lctx);
    if (IS.S && IS.stack[0] instanceof IS.UI.WorldScene) IS.Wd.postGlitch(lo, lctx, IS.Wd.glitch);

    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.fillStyle = '#05040a'; mctx.fillRect(0, 0, main.width, main.height);
    mctx.imageSmoothingEnabled = false;
    mctx.drawImage(lo, ox, oy, IS.W * scale, IS.H * scale);
    if (IS.settings.crt) {
      mctx.fillStyle = 'rgba(0,0,0,0.22)';
      const step = Math.max(2, Math.round(scale));
      for (let y = oy; y < oy + IS.H * scale; y += step) mctx.fillRect(ox, y, IS.W * scale, Math.max(1, step / 2));
    }
    mctx.setTransform(scale, 0, 0, scale, ox, oy);
    for (const s of IS.stack) if (s.drawUI) s.drawUI(mctx);
    IS.UI.drawToasts(mctx, dt);
  }

  function boot() {
    try { IS.fontFallback = ![...document.fonts].some((f) => f.family.replace(/["']/g, '') === 'VT323' && f.status === 'loaded'); } catch (e) { IS.fontFallback = true; }
    resize();
    IS.applyTouch();
    IS.I.bindTouch(document.getElementById('touch'));
    IS.push(new IS.UI.TitleScene());
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.ready) {
    let booted = false;
    const go = () => { if (!booted) { booted = true; boot(); } };
    document.fonts.load('12px VT323').then(go, go);
    setTimeout(go, 1500);
  } else boot();

  // debug hook for automated tests
  IS.debug = { canvas: main, lo };
})(window.IS);

</script>
