# Builds an installable Android APK (Capacitor WebView wrapper) and publishes it
# as the latest GitHub Release asset: releases/latest/download/infinite-school.apk
name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['src/**', 'data/**', 'index.html', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch VT323 font if missing
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/VT323-Regular.ttf ] || curl -fsSL -o assets/fonts/VT323-Regular.ttf https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r src data assets www/
      - name: Create Capacitor Android project
        run: |
          mkdir -p cap && cd cap
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mv ../www ./www
          npx cap init "Infinite School" com.jaineilrana.infiniteschool --web-dir www
          npx cap add android
          # landscape, fullscreen-friendly
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/infinite-school.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infinite School — build ${{ github.run_number }}
          body: |
            Android APK for Infinite School (Chapter One: Homeroom).
            Download **infinite-school.apk**, open it on your phone, and allow installs from your browser if asked.
          files: infinite-school.apk
          make_latest: true
